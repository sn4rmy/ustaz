name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ustaz
          POSTGRES_PASSWORD: ustaz
          POSTGRES_DB: ustaz
        ports:
          - 5432:5432
        # Tests start only after Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U ustaz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Without it the database tests are skipped instead of run.
      TEST_DATABASE_URL: postgresql://ustaz:ustaz@localhost:5432/ustaz

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires Node ^20.19 || >=22.12.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
