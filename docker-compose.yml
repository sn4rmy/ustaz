name: ustaz

services:
  db:
    image: pgvector/pgvector:pg16
    # The port is not published, so this password only works inside the Docker network.
    environment:
      POSTGRES_USER: ustaz
      POSTGRES_PASSWORD: ustaz
      POSTGRES_DB: ustaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustaz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: postgresql://ustaz:ustaz@db:5432/ustaz
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env, see .env.example}
    volumes:
      - materials:/app/data/materials
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend directly, so this is the address on your computer.
        VITE_API_URL: http://localhost:8000
        VITE_MOCK_API: none
    # Port 5173 as in development: the backend allows CORS for it, and Paddle's
    # default payment link points to it.
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  materials:
